<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Player Status</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #121212;
            color: #ffffff;
        }
        .container {
            background: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .track-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .album-art {
            width: 100px;
            height: 100px;
            background: #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
        .track-details h2 {
            margin: 0 0 5px 0;
            color: #1db954;
        }
        .track-details p {
            margin: 0 0 5px 0;
            color: #b3b3b3;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background: #1db954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #1ed760;
        }
        .status {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .refresh-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .refresh-btn:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Spotify Player Status</h1>
        
        <div class="track-info">
            <div class="album-art" id="albumArt">
                🎵
            </div>
            <div class="track-details">
                <h2 id="trackTitle">Loading...</h2>
                <p id="artistName">Artist</p>
                <p id="albumTitle">Album</p>
                <p id="duration">Duration</p>
            </div>
        </div>        <div class="controls">
            <button onclick="sendCommand('PlayPause')">⏯️ Play/Pause</button>
            <button onclick="sendCommand('Prev')">⏮️ Previous</button>
            <button onclick="sendCommand('Next')">⏭️ Next</button>
            <button onclick="sendCommand('Shuffle')">🔀 Shuffle</button>
            <button onclick="sendCommand('Repeat')">🔁 Repeat</button>
            <button onclick="fetchPlayerData()">📊 Get Data</button>
        </div>

        <div style="margin: 20px 0;">
            <label for="requestInput" style="display: block; margin-bottom: 5px;">Custom Request:</label>
            <input type="text" id="requestInput" placeholder="Enter URL or command" style="width: 70%; padding: 8px; margin-right: 10px;">
            <button onclick="sendRequest()" style="padding: 8px 16px;">🎵 Send Request</button>
        </div>

        <button class="refresh-btn" onclick="fetchPlayerData()">🔄 Refresh Status</button>
        
        <div class="status" id="status">Connecting...</div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:8443');
        const statusDiv = document.getElementById('status');

        // Connect to Socket.IO
        socket.on('connect', () => {
            statusDiv.textContent = '✅ Connected to server\n';
            fetchPlayerData();
        });

        socket.on('disconnect', () => {
            statusDiv.textContent += '❌ Disconnected from server\n';
        });        // Function to fetch current player data using Socket.IO getdata command
        function fetchPlayerData() {
            if (!socket || !socket.connected) {
                statusDiv.textContent += '❌ Not connected to server\n';
                return;
            }
            
            statusDiv.textContent += '📊 Requesting player data via getdata command...\n';
            socket.emit('getdata');
        }        // Function to send commands to Spotify
        function sendCommand(command) {
            socket.emit(command);
            statusDiv.textContent += `🎮 Sent command: ${command}\n`;
        }

        // Function to send custom requests
        function sendRequest() {
            const requestInput = document.getElementById('requestInput');
            const url = requestInput.value.trim();
            
            if (!url) {
                statusDiv.textContent += '❌ Please enter a URL or command\n';
                return;
            }
            
            socket.emit('request', url);
            statusDiv.textContent += `🎵 Sent request: ${url}\n`;
            requestInput.value = ''; // Clear the input
        }

        // Format duration from milliseconds to MM:SS
        function formatDuration(ms) {
            const seconds = Math.floor(parseInt(ms) / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        // Auto-refresh every 5 seconds
        setInterval(fetchPlayerData, 5000);        // Listen for any updates from the server
        socket.on('command', (data) => {
            statusDiv.textContent += `📨 Received update: ${JSON.stringify(data)}\n`;
            fetchPlayerData();
        });        // Listen for player data responses
        socket.on('player_data', (data) => {
            statusDiv.textContent += `🎵 Received player data\n`;
            
            // Handle the nested track structure
            const track = data.track || {};
            
            // Update UI
            document.getElementById('trackTitle').textContent = track.name || 'Unknown Track';
            document.getElementById('artistName').textContent = track.artist || 'Unknown Artist';
            document.getElementById('albumTitle').textContent = track.album || 'Unknown Album';
            document.getElementById('duration').textContent = formatDuration(track.duration_ms || 0);
            
            // Update album art
            const albumArtElement = document.getElementById('albumArt');
            const imageUrl = track.image_url || '';
            
            if (imageUrl && imageUrl.trim() !== '') {
                // Create or update the img element
                let imgElement = albumArtElement.querySelector('img');
                if (!imgElement) {
                    imgElement = document.createElement('img');
                    imgElement.style.width = '100%';
                    imgElement.style.height = '100%';
                    imgElement.style.objectFit = 'cover';
                    imgElement.style.borderRadius = '8px';
                    albumArtElement.innerHTML = '';
                    albumArtElement.appendChild(imgElement);
                }
                imgElement.src = imageUrl;
                imgElement.alt = `${track.album || 'Album'} cover`;
            } else {
                // Show default emoji if no image
                albumArtElement.innerHTML = '🎵';
            }
            
            // Update status
            statusDiv.textContent += `🎵 Current Track Data:\n${JSON.stringify(data, null, 2)}\n`;
        });
    </script>
</body>
</html>
