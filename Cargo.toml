[package]
name = "spotify-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socketioxide = "0.13"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
http = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tray-icon = "0.17"
image = "0.25"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
