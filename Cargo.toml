[package]
name = "spotify-server"
version = "0.1.0"
edition = "2021"

# Use Windows subsystem by default (no console)
[[bin]]
name = "spotify-server"
path = "src/main.rs"

# Profile for release builds - no console window
[profile.release]
lto = true
codegen-units = 1

# Profile for dev builds - with console
[profile.dev]
# Console will be available in dev builds

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socketioxide = "0.13"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
http = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tray-icon = "0.17"
image = "0.25"
anyhow = "1.0"
rust-embed = "8.0"
libc = "0.2"

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging", 
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Storage_FileSystem"
] }
